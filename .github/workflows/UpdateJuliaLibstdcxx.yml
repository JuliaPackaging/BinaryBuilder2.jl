name: Update Julia libstdc++ table

# Regenerates BinaryBuilderAuditor.jl/src/julia_libstdcxx_versions.jl, which records the
# libstdc++ bundled with every Julia release, and opens (or updates) a pull request when a
# new Julia release changed it.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Julia libstdc++ table
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate the generator's environment
        run: julia --color=yes --project=BinaryBuilderAuditor.jl/contrib -e 'import Pkg; Pkg.instantiate()'
      - name: Regenerate the table
        run: julia --color=yes --project=BinaryBuilderAuditor.jl/contrib BinaryBuilderAuditor.jl/contrib/generate_julia_libstdcxx_versions.jl
      - run: git diff
      - name: Create or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/update-julia-libstdcxx-table
          delete-branch: true
          add-paths: BinaryBuilderAuditor.jl/src/julia_libstdcxx_versions.jl
          commit-message: "🤖 Update the Julia libstdc++ table"
          title: "🤖 Update the Julia libstdc++ table"
          body: |
            This PR adds new Julia releases to the table of the libstdc++ each release bundles
            (`BinaryBuilderAuditor.jl/src/julia_libstdcxx_versions.jl`).
            It was generated by `.github/workflows/UpdateJuliaLibstdcxx.yml`.

            Note: CI does not run automatically on pull requests opened by this workflow.
            To run CI, close and reopen the PR.
